[package]
name = "can_decoder"
version = "0.1.0"
edition = "2021"
description = "High-performance, multi-threaded CAN frame decoder for J1939 diagnostics"

[[bin]]
name = "can_decoder"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
owo-colors = "4"

# SocketCAN support
socketcan = "3"
regex = "1.12.4"
anyhow = "1"
unicode-width = "0.2.2"
thiserror = "2.0.18"
