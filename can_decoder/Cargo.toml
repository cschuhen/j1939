[package]
name = "can_decoder"
version = "0.1.0"
edition = "2021"
description = "High-performance, multi-threaded CAN frame decoder for J1939 diagnostics"

[[bin]]
name = "can_decoder"
path = "src/main.rs"

[[bin]]
name = "can_decoder_tui"
path = "src/tui_main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
owo-colors = "4"
j1939-async = {"path"="../j1939-async"}
iso11783-data = { path = "../iso11783-data", features = ["task_controller_ddi", "name"] }

# SocketCAN support
socketcan = "3"
regex = "1.12.4"
anyhow = "1"
unicode-width = "0.2.2"
thiserror = "2.0.18"
ratatui = "0.30.2"
crossterm = "0.29.0"

# GPUI native GUI (from Zed mainline, same commit as rgitui)
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "f3fb4e04aa85dbbde6e83d28f231fc452cd8863f" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "f3fb4e04aa85dbbde6e83d28f231fc452cd8863f", features = ["font-kit", "x11", "wayland"] }

[[bin]]
name = "can_decoder_gpui"
path = "src/main_gpui.rs"
