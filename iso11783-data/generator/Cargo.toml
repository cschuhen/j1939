[package]
name = "generator"
version = "0.1.0"
edition = "2021"
description = "Generate ISO 11783 / ISOBUS constant definitions from Excel files"

[[bin]]
name = "generator"
path = "src/main.rs"

[[bin]]
name = "investigate"
path = "src/investigate.rs"

[dependencies]
calamine = "0.23"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
zip = "0.6"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
